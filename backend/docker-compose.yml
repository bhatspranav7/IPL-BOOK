services:

  app:
    build: .
    container_name: ipl_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ipldb
    volumes:
      - .:/app

  db:
    image: postgres:14
    container_name: ipl_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipldb
    ports:
      - "5433:5432"   # ✅ FIXED

  redis:
    image: redis:7
    container_name: ipl_redis
    ports:
      - "6379:6379"