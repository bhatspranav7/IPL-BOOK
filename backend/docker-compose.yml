# Dependencies only, for running uvicorn / vite on the host during development:
#   docker compose -f backend/docker-compose.yml up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5433/ipldb uvicorn main:app --reload
# For the whole stack in containers use the docker-compose.yml at the repo root.
services:
  db:
    image: postgres:16-alpine
    container_name: ipl_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipldb
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ipl_dev_redis
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
